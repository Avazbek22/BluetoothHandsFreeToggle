name: build

on:
  push:
    branches: ["master", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BluetoothHandsFreeToggle.sln

      - name: Build
        run: dotnet build BluetoothHandsFreeToggle.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BluetoothHandsFreeToggle.sln --configuration Release --no-build --no-restore

      - name: Verify x64 production publish
        run: >-
          dotnet publish BluetoothHandsFreeToggle/BluetoothHandsFreeToggle.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --nologo
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true

      - name: Verify ARM64 production publish
        run: >-
          dotnet publish BluetoothHandsFreeToggle/BluetoothHandsFreeToggle.csproj
          --configuration Release
          --runtime win-arm64
          --self-contained true
          --nologo
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true
